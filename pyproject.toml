[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-fabric"
version = "0.1.31"
description = "Coordinate AI agent teams from planning through release, with persistent task state and review. Supports user-wide and per-project installation."
requires-python = ">=3.10"

[project.scripts]
ai-agent-fabric = "ai_agent_fabric.__main__:main"
