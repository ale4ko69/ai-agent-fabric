[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-fabric"
version = "0.1.12"
description = "Portable project-local agent infrastructure with durable memory"
requires-python = ">=3.10"

[project.scripts]
ai-agent-fabric = "ai_agent_fabric.__main__:main"
